# Hooks for prek (https://prek.j178.dev), also compatible with pre-commit.
# Set them up with `just hooks`, run them on everything with `prek run --all-files`.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: \.lock$
      - id: end-of-file-fixer
        exclude: \.lock$
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: \.lock$
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, build, ci, chore]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(crates/pynespra|scripts)/.*\.pyi?$
      - id: ruff-format
        files: ^(crates/pynespra|scripts)/.*\.pyi?$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
        stages: [pre-push]
      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-features
        language: system
        files: \.rs$|(^|/)Cargo\.(toml|lock)$
        pass_filenames: false
        stages: [pre-push]
      - id: mypy
        name: mypy pynespra
        entry: uv run --no-project --with mypy --with orjson --with cbor2 --with tenacity mypy --config-file crates/pynespra/pyproject.toml crates/pynespra/python
        language: system
        files: ^crates/pynespra/python/
        pass_filenames: false
        stages: [pre-push]
