[package]
name = "vespa-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Async Rust client for Vespa"
repository = "https://github.com/kriogenia/nespra"
license = "MIT OR Apache-2.0"

[dependencies]
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
