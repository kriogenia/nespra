[package]
name = "nespra"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial async Rust client for the Vespa search engine"
repository = "https://github.com/kriogenia/nespra"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
keywords = ["vespa", "search", "client", "cbor", "async"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["request-models"]
request-models = []

[[example]]
name = "models"
required-features = ["request-models"]

[dependencies]
ciborium = "0.2.2"
http = "1.5.0"
reqwest = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["full"] }
