[package]
name = "nespra"
version = "0.1.2"
edition.workspace = true
rust-version.workspace = true
description = "Unofficial async Rust client for the Vespa search engine"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["vespa", "search", "client", "cbor", "async"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["request-models", "gzip"]
request-models = []
gzip = ["reqwest/gzip"]
admin = ["dep:nespra_admin"]

[[example]]
name = "models"
required-features = ["request-models"]

[dependencies]
bytes = "1"
ciborium = "0.2.2"
fastrand = "2"
http.workspace = true
nespra_admin = { path = "../admin", version = "0.1.0", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
