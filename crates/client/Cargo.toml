[package]
name = "nespra"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "Unofficial async Rust client for the Vespa search engine"
repository = "https://github.com/kriogenia/nespra"
license = "MIT OR Apache-2.0"
readme = "../../README.md"
keywords = ["vespa", "search", "client", "cbor", "async"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["request-models", "gzip"]
request-models = []
gzip = ["reqwest/gzip"]

[[example]]
name = "models"
required-features = ["request-models"]

[dependencies]
bytes = "1"
ciborium = "0.2.2"
fastrand = "2"
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
