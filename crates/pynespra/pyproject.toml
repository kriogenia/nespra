[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "pynespra"
description = "Unofficial Python client for the Vespa search engine, built on the nespra Rust crate"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
dependencies = ["orjson>=3.10", "cbor2>=5.6", "tenacity>=9.0"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/kriogenia/nespra"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "mypy"]

[tool.maturin]
python-source = "python"
module-name = "nespra._core"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
