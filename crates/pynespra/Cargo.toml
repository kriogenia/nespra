[package]
name = "pynespra"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings of nespra, an unofficial client for the Vespa search engine"
repository = "https://github.com/kriogenia/nespra"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
nespra = { path = "../client", version = "0.1.2", default-features = false, features = ["gzip"] }
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30.0", features = ["tokio-runtime"] }
