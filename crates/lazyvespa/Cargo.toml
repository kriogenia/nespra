[package]
name = "lazyvespa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Terminal UI to query and operate Vespa deployments"
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["vespa", "search", "tui", "terminal"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
insta = "1.49.0"
