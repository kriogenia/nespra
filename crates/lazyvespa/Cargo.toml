[package]
name = "lazyvespa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Terminal UI to query and operate Vespa deployments"
repository.workspace = true
license.workspace = true
readme = "README.md"
keywords = ["vespa", "search", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
jiff = { version = "1.0.3", default-features = false, features = ["std"] }
nespra = { path = "../client", version = "0.2.0", features = ["admin"] }
ratatui = "0.30.2"
ratatui-textarea = "0.9.4"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
wiremock = "0.6.5"
