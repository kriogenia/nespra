[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
http = "1.5.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "charset", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = "1.53.1"
