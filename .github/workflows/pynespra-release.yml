name: Release pynespra

# Publishes the Python package to PyPI when a `pynespra-v<version>` tag is pushed.
# Run it by hand to build all the wheels and publish them to TestPyPI instead.
on:
  push:
    tags: ["pynespra-v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tag must match the version of the crate, which is the one maturin uses
  version:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Compare the tag with the crate version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "pynespra") | .version')
          if [ "${GITHUB_REF_NAME}" != "pynespra-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the crate version ${version}"
            exit 1
          fi

  wheels:
    name: Wheels ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: auto }
          - { name: macos-aarch64, runner: macos-latest, target: aarch64, manylinux: auto }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: auto }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # maturin picks the license files up from the project directory
      - name: Copy the licenses
        shell: bash
        run: cp LICENSE-MIT LICENSE-APACHE crates/pynespra/
      # The extension uses the stable ABI, a single wheel per platform covers every Python
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pynespra
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.name }}
          path: crates/pynespra/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Copy the licenses
        run: cp LICENSE-MIT LICENSE-APACHE crates/pynespra/
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/pynespra
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/pynespra/dist/*.tar.gz
          if-no-files-found: error

  # Installs the built wheels in a clean environment before publishing anything
  smoke:
    name: Smoke test ${{ matrix.runner }}
    needs: wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install the wheel and use it
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --find-links dist pynespra
          python -m pip install orjson cbor2 tenacity
          python -c "import nespra; nespra.Vespa('http://localhost:8080'); nespra.AsyncVespa('http://localhost:8080'); print('ok')"

  publish:
    name: Publish
    if: github.repository_owner == 'kriogenia'
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && 'testpypi' || 'pypi' }}
    permissions:
      contents: write # the GitHub release
      id-token: write # PyPI trusted publishing, no token needed
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'workflow_dispatch' && 'https://test.pypi.org/legacy/' || '' }}
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          name: pynespra ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
